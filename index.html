<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moritz Steinbach — Können · Dürfen · Wollen</title>
<meta name="description" content="Ein ehrlicher Blick auf Ihre KI-Initiativen. 40 Minuten, kein Pitch.">
<style>
  @font-face {
    font-family: 'Inter';
    font-style: normal;
    font-display: swap;
    font-weight: 100 900;
    src: url('fonts/inter-latin-ext-wght-normal.woff2') format('woff2-variations');
    unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF;
  }
  @font-face {
    font-family: 'Inter';
    font-style: normal;
    font-display: swap;
    font-weight: 100 900;
    src: url('fonts/inter-latin-wght-normal.woff2') format('woff2-variations');
    unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0d0e10; transition: background-color 280ms ease; overflow: hidden; height: 100%; }
  html { height: 100%; }
  body::-webkit-scrollbar { display: none; }
  body { scrollbar-width: none; }
  #root { width: 100%; overflow-x: hidden; }
  ::selection { background: var(--sel, rgba(212,165,116,0.25)); }
  @keyframes satz-word-reveal {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes scroll-hint-bob {
    0%, 100% { transform: translateY(0); opacity: 1; }
    50%       { transform: translateY(5px); opacity: 0.6; }
  }
  @keyframes bubble-pop {
    0%   { transform: scale(0.55) translateY(8px); opacity: 0; }
    70%  { transform: scale(1.06) translateY(-2px); opacity: 1; }
    100% { transform: scale(1)    translateY(0);    opacity: 1; }
  }
  @keyframes s3-fade-up {
    from { opacity: 0; transform: translateY(28px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  /* Dezenter Legal-Footer — fixed, sichtbar auf allen Pages, unaufdringlich */
  #legal-footer {
    position: fixed;
    bottom: 14px;
    right: 18px;
    z-index: 250;
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'Inter', sans-serif;
    font-size: 10.5px;
    font-weight: 400;
    letter-spacing: 0.02em;
    color: rgba(180,175,162,0.42);
    pointer-events: auto;
    user-select: none;
  }
  #legal-footer a {
    color: inherit;
    text-decoration: none;
    transition: color 200ms ease;
    padding: 4px 2px;
  }
  #legal-footer a:hover { color: rgba(220,215,200,0.85); }
  #legal-footer span { opacity: 0.5; }
  @media (max-width: 640px) {
    #legal-footer { bottom: 8px; right: 10px; font-size: 9.5px; }
  }
</style>
</head>
<body>
<div id="root"></div>

<footer id="legal-footer" aria-label="Rechtliches">
  <a href="/impressum.html">Impressum</a>
  <span aria-hidden="true">·</span>
  <a href="/datenschutz.html">Datenschutz</a>
</footer>

<script src="js/react.production.min.js"></script>
<script src="js/react-dom.production.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
